# company-brain profile — provisioned defaults
# Set terminal.cwd to the employee's synced vault before install.

terminal:
  backend: local
  cwd: "REPLACE_WITH_VAULT_PATH"

memory:
  # Off on purpose: the vault is the durable memory (Memory.md, Sessions/,
  # the routing rules). A built-in memory tool wins every "remember this" —
  # and facts stored there are per-container and invisible to the brain:
  # never synced, never promotable, lost on rebuild. With no competing
  # tool, remembering has exactly one path — a vault file.
  memory_enabled: false
  user_profile_enabled: false

skills:
  write_approval: true
  # Off on purpose, same policy as memory: the bundled llm-wiki skill builds
  # a knowledge base at ~/wiki — outside the vault, unsynced, invisible to
  # promotions. The vault IS the wiki (Company/Intel/); with no competing
  # tool, distilled knowledge has exactly one path — a vault file.
  disabled:
    - llm-wiki

display:
  tool_progress: new

# Gateway lifecycle pings, off on purpose. On every restart the gateway
# broadcasts "⚠️ Gateway shutting down" / "♻️ Gateway online" to each platform's
# home channel — but here a restart is always an operator action (image roll,
# compose regen, box reboot), never something the user asked for or can act on.
# They get pinged about our maintenance window.
#
# The same flag also silences the per-active-session "your task was interrupted,
# message me and I'll resume" note. Hermes has no separate control for the two,
# and noise on every deploy is the worse of them.
#
# Top level, NOT under `gateway.platforms` — that nested path is the headline
# case of hermes #34067, silently written and never read. A block naming only
# this key does not enable the platform: enablement still comes from
# TELEGRAM_BOT_TOKEN / the four EMAIL_* vars.
telegram:
  gateway_restart_notification: false

email:
  gateway_restart_notification: false
